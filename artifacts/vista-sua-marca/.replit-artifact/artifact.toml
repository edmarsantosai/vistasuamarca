kind = "web"
previewPath = "/"
title = "Vista Sua Marca"
version = "1.0.0"
id = "artifacts/vista-sua-marca"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21037

[services.development]
run = "pnpm --filter @workspace/vista-sua-marca run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vista-sua-marca", "run", "build" ]
publicDir = "artifacts/vista-sua-marca/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21037"
BASE_PATH = "/"
